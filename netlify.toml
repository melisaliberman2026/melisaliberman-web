# Configuración de Netlify
# El sitio es estático: no necesita compilación.

[build]
  publish = "."
  command = ""

# =========================================================
#  CACHÉ
# =========================================================
# Regla única para TODO el sitio: el navegador siempre pregunta al servidor
# si el archivo cambió. Si no cambió, Netlify responde 304 (unos pocos bytes,
# instantáneo) y el navegador usa su copia. Si cambió, lo baja de nuevo.
#
# Ojo con el patrón: "/*" es el único que cubre la home ("/") y las URLs
# limpias ("/tratamientos"). Un patrón "/*.html" NO las alcanza, porque esas
# direcciones no terminan en .html — ese era el motivo por el que había que
# borrar la caché a mano para ver los cambios.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# =========================================================
#  URLs limpias: /tratamientos → /tratamientos.html
# =========================================================
[[redirects]]
  from = "/tratamientos"
  to = "/tratamientos.html"
  status = 200
[[redirects]]
  from = "/sobre-mi"
  to = "/sobre-mi.html"
  status = 200
[[redirects]]
  from = "/contacto"
  to = "/contacto.html"
  status = 200
