# Configuración de Netlify
# El sitio es estático: no necesita compilación.

[build]
  publish = "."
  command = ""

# Caché: como los archivos mantienen siempre el mismo nombre (hero.jpg, styles.css…),
# el navegador tiene que volver a preguntar si cambiaron. Si no, los visitantes que ya
# entraron una vez seguirían viendo la versión vieja.
# "must-revalidate" hace que pregunte; si no cambió, el servidor responde 304 (sin descargar).

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# URLs limpias: /tratamientos → /tratamientos.html
[[redirects]]
  from = "/tratamientos"
  to = "/tratamientos.html"
  status = 200
[[redirects]]
  from = "/sobre-mi"
  to = "/sobre-mi.html"
  status = 200
[[redirects]]
  from = "/contacto"
  to = "/contacto.html"
  status = 200
